<script>

/* =====================================================

===================================================== */

const SUPABASE_URL =
"https://wcamvnvhcguxwujcwyyj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjYW12bnZoY2d1eHd1amN3eXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjcwNDYsImV4cCI6MjEwMzgwMzA0Nn0.qnkYuFIcbRP8aBzPyIfxamOfVvBrU3nNhMa__NiyYPA";

const supabaseClient =
supabase.createClient(

/* =====================================================
   AUTHENTIFICATION
===================================================== */

async function updateAuthArea() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();

    const authArea =
        document.getElementById("auth-area");

    if (user) {

        const firstName =
            user.user_metadata?.first_name ||
            "Mon compte";

        authArea.innerHTML =
            "<span style='color:#666;font-size:14px'>" +
            "Bonjour, " +
            firstName +
            "</span>" +

            "<a href='#' id='logout-link' " +
            "style='margin-left:15px'>" +
            "Se déconnecter" +
            "</a>";

        document
            .getElementById("logout-link")
            .addEventListener(
                "click",
                async function(e) {

                    e.preventDefault();

                    await supabaseClient
                        .auth
                        .signOut();

                    window.location.href =
                        "index.html";
                }
            );

    } else {

        authArea.innerHTML =
            "<a href='auth.html'>" +
            "Connexion" +
            "</a>";
    }
}

updateAuthArea();


/* =====================================================
   VILLES DU CANADA
===================================================== */

const cities = {

    AB: [
        "Calgary",
        "Edmonton",
        "Red Deer",
        "Lethbridge",
        "Fort McMurray"
    ],

    BC: [
        "Vancouver",
        "Victoria",

    ],

    ],

    ],

    ],

    ],

    ]

};


/* =====================================================
   PROVINCE → VILLE
===================================================== */

const provinceSelect =
    document.getElementById("province");

const citySelect =
    document.getElementById("city");

provinceSelect.addEventListener(
    "change",
    function() {

        const province =
            provinceSelect.value;

        citySelect.innerHTML = "";

        if (!province) {

            citySelect.innerHTML =
                "<option value=''>" +
                "Choisir d'abord une province" +
                "</option>";

            return;
        }

        citySelect.innerHTML =
            "<option value=''>" +
            "Choisir une ville" +
            "</option>";

        cities[province].forEach(
            function(city) {

                const option =
                    document.createElement("option");

                option.value = city;
                option.textContent = city;

                citySelect.appendChild(option);
            }
        );
    }
);


/* =====================================================
   CATEGORIE
===================================================== */

const categorySelect =
    document.getElementById("category");

const clothingSizeGroup =
    document.getElementById(
        "clothing-size-group"
    );

const sizeSelect =
    document.getElementById("size");

const shoeSizeGroup =
    document.getElementById(
        "shoe-size-group"
    );

const shoeSizeSelect =
    document.getElementById(
        "shoe-size"
    );


function updateCategoryFields() {

    const category =
        categorySelect.value;

    const isClothing =
        category === "Vêtements";

    const isShoes =
        category === "Chaussures";


    clothingSizeGroup.style.display =
        isClothing ? "" : "none";

    sizeSelect.required =
        isClothing;

    if (!isClothing) {
        sizeSelect.value = "";
    }


    shoeSizeGroup.style.display =
        isShoes ? "" : "none";

    shoeSizeSelect.required =
        isShoes;

    if (!isShoes) {
        shoeSizeSelect.value = "";
    }
}

categorySelect.addEventListener(
    "change",
    updateCategoryFields
);

updateCategoryFields();


/* =====================================================
   APERÇU DES PHOTOS
===================================================== */

const photoInput =
    document.getElementById("photos");

const photoPreview =
    document.getElementById(
        "photo-preview"
    );


photoInput.addEventListener(
    "change",
    function() {

        photoPreview.innerHTML = "";

        const files =
            Array.from(photoInput.files);

        if (files.length > 5) {

            alert(
                "Vous pouvez sélectionner maximum 5 photos."
            );

            photoInput.value = "";

            return;
        }

        files.forEach(function(file) {

            const img =
                document.createElement("img");

            img.src =
                URL.createObjectURL(file);

            img.alt =
                "Aperçu de la photo";

            photoPreview.appendChild(img);

        });

    }
);


/* =====================================================
   PUBLICATION
===================================================== */

const form =
    document.getElementById("sell-form");

const publishButton =
    document.getElementById(
        "publish-button"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ---------------------------------------------
           VERIFICATION UTILISATEUR
        --------------------------------------------- */

        const {
            data: { user },
            error: authError
        } =
            await supabaseClient.auth.getUser();


        if (authError || !user) {

            alert(
                "Vous devez être connecté pour publier un article."
            );

            window.location.href =
                "auth.html";

            return;
        }


        /* ---------------------------------------------
           RECUPERATION DES DONNEES
        --------------------------------------------- */

        const name =
            document.getElementById("name")
                .value
                .trim();

        const category =
            categorySelect.value;

        const brand =
            document.getElementById("brand")
                .value
                .trim();

        let size = null;

        if (category === "Vêtements") {
            size = sizeSelect.value;
        }

        const shoeSize =
            category === "Chaussures"
                ? shoeSizeSelect.value
                : null;

        const price =
            parseFloat(
                document.getElementById("price")
                    .value
            );

        const conditionInput =
            document.querySelector(
                'input[name="condition"]:checked'
            );

        const condition =
            conditionInput
                ? conditionInput.value
                : null;

        const defects =
            document.getElementById("defects")
                .value
                .trim();

        const description =
            document.getElementById("description")
                .value
                .trim();

        const province =
            provinceSelect.value;

        const city =
            citySelect.value;


        /* ---------------------------------------------
           PHOTOS
        --------------------------------------------- */

        const files =
            Array.from(photoInput.files);


        if (!files.length) {

            alert(
                "Veuillez ajouter au moins une photo."
            );

            return;
        }


        if (files.length > 5) {

            alert(
                "Vous pouvez ajouter maximum 5 photos."
            );

            return;
        }


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (
            !name ||
            !category ||
            isNaN(price) ||
            price < 0 ||
            !condition ||
            !province ||
            !city
        ) {

            alert(
                "Veuillez remplir tous les champs obligatoires."
            );

            return;
        }


        if (
            category === "Vêtements" &&
            !size
        ) {

            alert(
                "Veuillez sélectionner une taille."
            );

            return;
        }


        if (
            category === "Chaussures" &&
            !shoeSize
        ) {

            alert(
                "Veuillez sélectionner une pointure."
            );

            return;
        }


        /* ---------------------------------------------
           BOUTON
        --------------------------------------------- */

        publishButton.disabled = true;

        publishButton.textContent =
            "Envoi des photos...";


        try {

            /* -----------------------------------------
               UPLOAD DES PHOTOS
            ----------------------------------------- */

            const photoUrls = [];


            for (
                let i = 0;
                i < files.length;
                i++
            ) {

                const file =
                    files[i];


                /* Vérifier type */

                if (
                    !file.type.startsWith("image/")
                ) {

                    throw new Error(
                        "Tous les fichiers doivent être des images."
                    );
                }


                /* Limite 10 MB */

                if (
                    file.size > 10 * 1024 * 1024
                ) {

                    throw new Error(
                        "Chaque photo doit faire moins de 10 MB."
                    );
                }


                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    user.id +
                    "/" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2) +
                    "." +
                    extension;


                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("articles-photos")
                        .upload(
                            fileName,
                            file,
                            {
                                cacheControl: "3600",
                                upsert: false,
                                contentType: file.type
                            }
                        );


                if (uploadError) {

                    throw new Error(
                        "Erreur photo : " +
                        uploadError.message
                    );
                }


                const {
                    data: publicUrlData
                } =
                    supabaseClient
                        .storage
                        .from("articles-photos")
                        .getPublicUrl(
                            fileName
                        );


                photoUrls.push(
                    publicUrlData.publicUrl
                );

            }


            /* -----------------------------------------
               PUBLICATION
            ----------------------------------------- */

            publishButton.textContent =
                "Publication de l'article...";


            const articleData = {

                name: name,

                category: category,

                brand: brand || null,

                size: size,

                price: price,

                condition: condition,

                defects:
                    defects || null,

                description:
                    description || null,

                province: province,

                city: city,

                photo_urls: photoUrls,

                seller_id: user.id

            };


            if (
                category === "Chaussures"
            ) {

                articleData.shoe_size =
                    shoeSize;

            }


            /* -----------------------------------------
               INSERTION SUPABASE
            ----------------------------------------- */

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("Articles")
                    .insert([articleData])
                    .select()
                    .single();


            if (error) {

                console.error(
                    "Erreur Supabase :",
                    error
                );

                throw new Error(
                    error.message
                );
            }


            /* -----------------------------------------
               SUCCES
            ----------------------------------------- */

            console.log(
                "Article publié :",
                data
            );


            alert(
                "Votre article a été publié avec succès ! 🎉"
            );


            form.reset();

            photoPreview.innerHTML = "";

            updateCategoryFields();

            citySelect.innerHTML =
                "<option value=''>" +
                "Choisir d'abord une province" +
                "</option>";


        } catch (error) {

            console.error(
                "Erreur :",
                error
            );

            alert(
                "Erreur lors de la publication : " +
                error.message
            );

        } finally {

            publishButton.disabled = false;

            publishButton.textContent =
                "Publier mon article";

        }

    }
);

</script>

</body>

</html>
